services:
  xlt-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: xlt-mcp:latest
    container_name: xlt-mcp
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8500:8000"
    volumes:
      - xlt-mcp-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8500/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - cloudflare_net

volumes:
  xlt-mcp-data:

networks:
  cloudflare_net:
    external: true

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sign in to Xelta</title>
<style>
  :root { --fg: #1f1f1f; --muted: #6b6b6b; --border: #d9d9d9; --accent: #2563eb; --surface: #f5f5f5; --ok: #15803d; --err: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fg: #ececec; --muted: #a3a3a3; --border: #3f3f3f; --accent: #60a5fa; --surface: #262626; --ok: #4ade80; --err: #f87171; }
  }
  :root[data-theme="dark"] { --fg: #ececec; --muted: #a3a3a3; --border: #3f3f3f; --accent: #60a5fa; --surface: #262626; --ok: #4ade80; --err: #f87171; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: transparent; color: var(--fg); }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .box { box-sizing: border-box; max-width: 440px; margin: 8px 2px; padding: 14px 16px;
         border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
  h2 { margin: 0 0 4px; font-size: 15px; }
  p { margin: 0; color: var(--muted); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  button { font: inherit; padding: 7px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  .status { font-size: 12.5px; color: var(--muted); }
  .status.ok { color: var(--ok); } .status.err { color: var(--err); }
  .fallback { margin-top: 10px; font-size: 12px; word-break: break-all; }
  .fallback a { color: var(--accent); }
</style>
</head>
<body>
<div class="box">
  <h2 id="title">Sign in to Xelta</h2>
  <p id="sub">Connect your Xelta account to create images and videos.</p>
  <div class="row" id="row">
    <button id="go" disabled>Sign in</button>
    <span class="status" id="status">Connecting…</span>
  </div>
  <p class="fallback" id="fallback" hidden>If no browser window opened: <a id="link" target="_blank" rel="noopener"></a></p>
</div>

<script type="module">
  const SDK_URL = "https://unpkg.com/@modelcontextprotocol/ext-apps@2.0.0/app-with-deps";
  const POLL_MS = 3000;
  const LIMIT_MS = 15 * 60 * 1000;   // the sign-in flow itself expires after ~15 minutes

  const $ = (id) => document.getElementById(id);
  let app = null, authUrl = "", timer = null, startedAt = 0, finished = false;

  function status(text, kind = "") { $("status").textContent = text; $("status").className = "status " + kind; }

  function signedIn(state) {
    finished = true;
    clearTimeout(timer);
    $("title").textContent = "Signed in to Xelta ✓";
    $("sub").textContent = state.email ? `As ${state.email}` : "";
    $("row").hidden = true; $("fallback").hidden = true;
  }

  function showLink(url) {
    authUrl = url || authUrl;
    $("link").href = authUrl; $("link").textContent = authUrl;
    $("go").disabled = !authUrl;
    status("");
  }

  // One non-blocking xelta_login step per tick; the tool never waits on the user.
  async function tick() {
    if (finished) return;
    if (Date.now() - startedAt > LIMIT_MS) { status("The sign-in link expired. Ask Claude to sign in again.", "err"); return; }
    try {
      const res = await app.callServerTool({ name: "xelta_login", arguments: {} });
      const s = (res && !res.isError && res.structuredContent) || null;
      if (s && s.signed_in) {
        signedIn(s);
        await app.sendMessage({ role: "user", content: [{ type: "text",
          text: "I've signed in to Xelta. Please continue with my previous request." }] }).catch(() => {});
        await app.requestTeardown().catch(() => {});
        return;
      }
      if (s && s.auth_url) showLink(s.auth_url);
    } catch { /* transient; keep waiting */ }
    timer = setTimeout(tick, POLL_MS);
  }

  $("go").addEventListener("click", async () => {
    if (!authUrl) return;
    const caps = app.getHostCapabilities() || {};
    if (caps.openLinks) {
      try { await app.openLink({ url: authUrl }); } catch { $("fallback").hidden = false; }
    } else {
      $("fallback").hidden = false;
    }
    $("go").disabled = true;
    status("Waiting for you to finish signing in…");
    if (!startedAt) { startedAt = Date.now(); tick(); }
  });

  function applyTheme(ctx) {
    if (ctx && (ctx.theme === "dark" || ctx.theme === "light")) document.documentElement.dataset.theme = ctx.theme;
  }

  if (window.parent !== window) {
    try {
      const { App } = await import(SDK_URL);
      app = new App({ name: "Xelta Sign-in", version: "2.0.0" });
      app.ontoolresult = (r) => {
        const s = (r && r.structuredContent) || {};
        if (s.signed_in) signedIn(s);
        else if (s.auth_url) showLink(s.auth_url);
        else status((r && r.content && r.content[0] && r.content[0].text) || "Couldn't start sign-in.", "err");
      };
      app.onhostcontextchanged = applyTheme;
      await app.connect();
      applyTheme(app.getHostContext());
    } catch (e) {
      status(`Couldn't start sign-in: ${e.message}`, "err");
    }
  } else {
    status("Open this from Claude.", "err");
  }
</script>
</body>
</html>
